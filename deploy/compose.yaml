# Production on one server (see deploy/README.md). Local development is Aspire
# (dotnet run --project backend/src/AiPlanner.AppHost) - this file is only for
# the server.
#
#   cd deploy && cp .env.example .env   # fill it in
#   docker compose up -d --build
name: aiplanner

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aiplannerdb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiplannerdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__aiplannerdb: Host=postgres;Database=aiplannerdb;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      AiProvider__ApiKey: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env}
      Auth__AllowedEmails: ${ALLOWED_EMAILS:-}
      Admin__Emails: ${ADMIN_EMAILS:-}
      Email__ApiKey: ${RESEND_API_KEY:-}
      WebPush__PublicKey: ${VAPID_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${VAPID_PRIVATE_KEY:-}
      Email__From: ${EMAIL_FROM:-}
      ExternalAuth__Google__WebClientId: ${GOOGLE_WEB_CLIENT_ID:-}
      ExternalAuth__Apple__ServicesId: ${APPLE_SERVICES_ID:-}
      ExternalAuth__Apple__RedirectUri: ${APPLE_REDIRECT_URI:-}
      ExternalAuth__Apple__BundleId: ${APPLE_BUNDLE_ID:-}
      RateLimits__AiPerDay: ${AI_PER_DAY:-200}
    volumes:
      - recordings:/data

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      HOME_DOMAINS: ${HOME_DOMAINS:-www.localhost}
      HOME_REDIRECT: ${HOME_REDIRECT:-localhost}
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Phone app downloads (/dl/...), kept across rebuilds of this image.
      - downloads:/srv/dl
    # Also on the network the staging copy joins, to forward STAGING_DOMAIN to it.
    networks:
      - default
      - edge

  # Every night: a database dump and an archive of the recordings, kept 14 days
  # (in the "backups" volume - copy them off the server too, see README).
  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
      - recordings:/recordings:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 3600
          day=$$(date +%F)
          pg_dump -h postgres -U postgres -d aiplannerdb -f /tmp/db.sql \
            && gzip -c /tmp/db.sql > /backups/db-$$day.sql.gz \
            || echo "backup: pg_dump failed"
          rm -f /tmp/db.sql
          tar czf /backups/recordings-$$day.tgz -C /recordings .
          find /backups -type f -mtime +14 -delete
          sleep 82800
        done

  # Off the server (2026-10-18): every night the backups above go to Backblaze B2, encrypted on
  # this server first (rclone crypt - B2 never sees the data or the file names). Off until the
  # B2_* settings and BACKUP_PASSPHRASE are in .env. Restore: see README.
  offsite:
    image: rclone/rclone:1.68
    restart: unless-stopped
    environment:
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - backups:/backups:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$B2_KEY_ID" ] || [ -z "$$BACKUP_PASSPHRASE" ]; then
          echo "offsite: not set up (B2_KEY_ID / BACKUP_PASSPHRASE) - sleeping"; exec sleep infinity
        fi
        export RCLONE_CONFIG_B2_TYPE=b2 RCLONE_CONFIG_B2_ACCOUNT="$$B2_KEY_ID" RCLONE_CONFIG_B2_KEY="$$B2_APP_KEY"
        export RCLONE_CONFIG_SECURE_TYPE=crypt RCLONE_CONFIG_SECURE_REMOTE="b2:$$B2_BUCKET/gatazee"
        export RCLONE_CONFIG_SECURE_PASSWORD="$$(rclone obscure "$$BACKUP_PASSPHRASE")"
        while true; do
          sleep 7200
          rclone copy /backups secure: --max-age 48h -v && echo "offsite: copied" || echo "offsite: FAILED"
          rclone delete secure: --min-age 30d -v || true
          sleep 79200
        done

networks:
  # Shared with compose.staging.yaml; made once by tools/deploy.sh
  # (docker network create gatazee-edge).
  edge:
    name: gatazee-edge
    external: true

volumes:
  downloads:
  pgdata:
  recordings:
  caddy_data:
  caddy_config:
  backups:
